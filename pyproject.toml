[project]
name = "yourebrand"
version = "0.1.0"
description = "Sistema agéntico para Yourebrand (creativo, supervisor, extractor de tareas)"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic",
    "pydantic-settings",
    "fastapi",
    "uvicorn",
    "qdrant-client",
    "supabase",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
