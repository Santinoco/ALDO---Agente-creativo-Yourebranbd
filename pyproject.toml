[project]
name = "yourebrand"
version = "0.1.0"
description = "Sistema agéntico para Yourebrand (creativo, supervisor, extractor de tareas)"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "google-genai",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "langgraph>=1.2,<2",
    "fastapi",
    "uvicorn",
    "qdrant-client",
    "supabase",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# La pantalla de demo no es código Python: sin esto, una instalación que no sea
# editable (por ejemplo en Docker) no la incluiría.
[tool.setuptools.package-data]
yourebrand = ["api/static/*", "creative/skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
